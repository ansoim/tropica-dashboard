name: Deploy Tropica dashboard

on:
  push:
    branches: [main]
    paths:
      - "data/sales.json"
      - "index.html"
      - "assets/**"
      - ".github/workflows/refresh-dashboard.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: tropica-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Get dashboard files
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload dashboard to GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy dashboard
        id: deployment
        uses: actions/deploy-pages@v4
